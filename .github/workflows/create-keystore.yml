name: Create Android Release Keystore (Run Once)

on:
  workflow_dispatch:

jobs:
  generate-keystore:
    name: Generate JKS & Base64 Artifact
    runs-on: ubuntu-latest
    steps:
      - name: Validate Keystore Secrets & Generate Keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set +x
          MISSING=""
          if [ -z "$KEYSTORE_PASSWORD" ]; then MISSING="$MISSING KEYSTORE_PASSWORD"; fi
          if [ -z "$KEY_ALIAS" ]; then MISSING="$MISSING KEY_ALIAS"; fi
          if [ -z "$KEY_PASSWORD" ]; then MISSING="$MISSING KEY_PASSWORD"; fi

          if [ -n "$MISSING" ]; then
            echo "::error::Missing required GitHub Secret(s):$MISSING. Please add KEYSTORE_PASSWORD, KEY_ALIAS, and KEY_PASSWORD in Settings -> Secrets and variables -> Actions before running this workflow."
            exit 1
          fi

          OUT_DIR="$RUNNER_TEMP/keystore-bundle"
          mkdir -p "$OUT_DIR"

          keytool -genkeypair \
            -v \
            -keystore "$OUT_DIR/release.jks" \
            -storetype JKS \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -alias "$KEY_ALIAS" \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=LogiCut Studio Pro, OU=Mobile, O=LogiCut, L=Indore, ST=Madhya Pradesh, C=IN" \
            -noprompt > /dev/null 2>&1

          base64 -w 0 "$OUT_DIR/release.jks" > "$OUT_DIR/keystore_base64.txt"
          echo "Release keystore and base64 file generated cleanly (secrets not printed)."

      - name: Upload Keystore Bundle (1-Day Retention)
        uses: actions/upload-artifact@v4
        with:
          name: android-release-keystore-bundle
          path: |
            ${{ runner.temp }}/keystore-bundle/release.jks
            ${{ runner.temp }}/keystore-bundle/keystore_base64.txt
          retention-days: 1
